<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Ghostbusters Tactical Soundboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root {
      --bg: #121212;
      --panel: #1e1e1e;
      --red: #e21c24;
      --red-hover: #b91c1c;
      --slime: #39ff14;
      --text: #f3f4f6;
      --text-dim: #9ca3af;
      --border: #2e2e2e;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 12px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
    }

    .master-bar {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 14px;
      margin-bottom: 12px;
      gap: 10px;
    }
    .title {
      font-size: 1rem;
      font-weight: bold;
      color: var(--red);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .vol-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      color: var(--text-dim);
    }
    input[type="range"] {
      width: 90px;
      accent-color: var(--red);
    }
    .btn-stop {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 6px 12px;
      font-size: 0.75rem;
      font-weight: bold;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-stop:hover { background: var(--red-hover); }

    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      border-bottom: 2px solid var(--border);
      padding-bottom: 2px;
      margin-bottom: 12px;
    }
    .tab-btn {
      background: var(--panel);
      border: 1px solid var(--border);
      border-bottom: none;
      border-radius: 4px 4px 0 0;
      color: var(--text-dim);
      padding: 8px 12px;
      font-size: 0.75rem;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .tab-btn.active {
      color: var(--slime);
      box-shadow: inset 0 2px 0 var(--slime);
      background: #252525;
    }

    .panel { display: none; }
    .panel.active { display: block; }

    .subcategory-title {
      font-size: 0.85rem;
      font-weight: bold;
      color: var(--slime);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin: 14px 0 8px 0;
      border-bottom: 1px solid var(--border);
      padding-bottom: 4px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
      gap: 10px;
    }

    .tile {
      background: #222225;
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 10px 8px;
      min-height: 64px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      text-align: center;
      cursor: pointer;
      position: relative;
    }
    .tile:hover { background: #2a2a2e; border-color: #444; }
    .tile-name { font-size: 0.75rem; font-weight: bold; line-height: 1.25; }
    .tile-sub { font-size: 0.6rem; color: var(--text-dim); text-transform: uppercase; margin-top: 4px; }

    .tile.playing {
      border-color: var(--slime);
      background: #14280f;
    }
    .tile.playing .tile-name { color: var(--slime); }

    .loop-badge {
      position: absolute;
      top: 3px;
      right: 4px;
      font-size: 0.55rem;
      color: var(--slime);
      opacity: 0.8;
    }

    .status { font-size: 0.8rem; color: var(--slime); font-weight: bold; min-height: 20px; text-align: center; margin-bottom: 10px; }
  </style>
</head>
<body>

  <div class="master-bar">
    <div class="title">🚫 GB Tactical Audio Station</div>

        <span>🔊</span>

    </div>

    let masterVol = 0.8;
    const activeAudios = {};

    function safeUrl(relativePath) {
      return relativePath.split('/').map(segment => encodeURIComponent(segment)).join('/');
    }

    function setVol(v) {
      masterVol = parseFloat(v);
      Object.values(activeAudios).forEach(a => { if (a) a.volume = masterVol; });
    }

    function stopAll() {
      Object.keys(activeAudios).forEach(k => {
        if (activeAudios[k]) { activeAudios[k].pause(); activeAudios[k] = null; }
      });
      document.querySelectorAll('.tile').forEach(t => t.classList.remove('playing'));
      document.getElementById('status').innerText = "All active frequencies silenced.";
    }

    function playAudio(el, path, loop = false) {
      if (activeAudios[path]) {
        activeAudios[path].pause();
        activeAudios[path] = null;
        if (el) el.classList.remove('playing');
        return;
      }

      const audio = new Audio(safeUrl(path));
      audio.volume = masterVol;
      audio.loop = loop;
      audio.onended = () => {
        if (!audio.loop) {
          activeAudios[path] = null;
          if (el) el.classList.remove('playing');
        }
      };

      activeAudios[path] = audio;
      if (el) el.classList.add('playing');

      audio.play().catch(e => {
        console.error("Playback error:", e);
        if (el) el.classList.remove('playing');
        activeAudios[path] = null;
        document.getElementById('status').innerText = "❌ File Error: " + path.split('/').pop();
      });
    }

    function playPool(el, pool, name) {
      if (!pool || !pool.length) return;
      const path = pool[Math.floor(Math.random() * pool.length)];
      const fileName = path.split('/').pop().replace('.mp3', '');
      document.getElementById('status').innerText = "🎯 " + name + " Fired: " + fileName;
      playAudio(el, path, false);
    }

    function renderBoard() {
      const tabContainer = document.getElementById('tabContainer');
      const panelContainer = document.getElementById('panelContainer');

      let isFirst = true;
      Object.keys(SOUND_DATABASE).forEach(catKey => {
        const cat = SOUND_DATABASE[catKey];
        
        // Render Tab Button
        const tabBtn = document.createElement('button');
        tabBtn.className = 'tab-btn' + (isFirst ? ' active' : '');
        tabBtn.innerText = cat.title;
        tabBtn.onclick = (e) => switchTab(e, 'panel-' + catKey);
        tabContainer.appendChild(tabBtn);

        // Render Panel
        const panel = document.createElement('div');
        panel.id = 'panel-' + catKey;
        panel.className = 'panel' + (isFirst ? ' active' : '');

        cat.subcategories.forEach(sub => {
          const subTitle = document.createElement('div');
          subTitle.className = 'subcategory-title';
          subTitle.innerText = sub.name;
          panel.appendChild(subTitle);

          const grid = document.createElement('div');
          grid.className = 'grid';

          sub.items.forEach(item => {
            const tile = document.createElement('div');
            tile.className = 'tile';

            const tileName = document.createElement('span');
            tileName.className = 'tile-name';
            tileName.innerText = item.name;
            tile.appendChild(tileName);

            if (item.sub) {
              const tileSub = document.createElement('span');
              tileSub.className = 'tile-sub';
              tileSub.innerText = item.sub;
              tile.appendChild(tileSub);
            } else if (item.loop) {
              const loopBadge = document.createElement('span');
              loopBadge.className = 'loop-badge';
              loopBadge.innerText = '🔄 Loop';
              tile.appendChild(loopBadge);
            }

            if (item.pool) {
              tile.onclick = () => playPool(tile, item.pool, item.name);
            } else {
              tile.onclick = () => playAudio(tile, item.file, item.loop || false);
            }

            grid.appendChild(tile);
          });

          panel.appendChild(grid);
        });

        panelContainer.appendChild(panel);
        isFirst = false;
      });
    }

    function switchTab(e, panelId) {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
      e.target.classList.add('active');
      document.getElementById(panelId).classList.add('active');
    }

    // Build the dynamic UI on page load
    renderBoard();
  </script>
